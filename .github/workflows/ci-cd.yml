name: 🛡️ Aegis Auth System CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Test & Build (Validates changes in Pull Requests and direct pushes)
  build-and-test:
    name: 🧪 Run Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Build and Test Backend
      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 🧪 Run Backend Integration Tests
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: github_actions_runner_test_access_secret_98765
          JWT_REFRESH_SECRET: github_actions_runner_test_refresh_secret_98765

      # Build Frontend
      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🏗️ Compile Frontend (Vite Build)
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: http://localhost:5000/api/auth

  # Job 2: Deploy to Staging & Run Smoke Tests
  deploy-staging:
    name: 🚀 Deploy Staging & Smoke Test
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🌐 Deploy Backend & Frontend to Staging
        # In a real environment, you would use actions like Vercel CLI, Firebase CLI, Heroku Git, etc.
        # Here we simulate the deployment script and inject environment variables from GitHub Secrets
        run: |
          echo "🚚 Deploying files to Staging Servers..."
          echo "💉 Injecting Staging Environment Secrets..."
          # Simulation: npm install -g firebase-tools or equivalent CLI
          # firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}
          echo "✅ Staging Deployment complete!"
        env:
          MONGO_URI: ${{ secrets.STAGING_MONGO_URI }}
          JWT_ACCESS_SECRET: ${{ secrets.STAGING_JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.STAGING_JWT_REFRESH_SECRET }}
          EMAIL_SERVICE: ${{ secrets.STAGING_EMAIL_SERVICE }}
          EMAIL_HOST: ${{ secrets.STAGING_EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.STAGING_EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.STAGING_EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.STAGING_EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.STAGING_EMAIL_FROM }}
          FRONTEND_URL: https://staging.aegisauth.example.com

      - name: 📡 Run Staging Smoke Verification
        run: |
          # Target our deployed staging backend URL (can be customized via environment)
          node backend/scripts/smoke-test.js
        env:
          TARGET_URL: https://staging.aegisauth.example.com

  # Job 3: Deploy to Production (Runs ONLY after Staging and Smoke Tests pass)
  deploy-production:
    name: 🏆 Release Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Deploy Backend & Frontend to Production
        run: |
          echo "👑 Deploying files to Production Clusters..."
          echo "💉 Injecting Production Credentials..."
          # Simulation: npm run deploy:prod
          echo "🎉 Production Deployment completed and live!"
        env:
          MONGO_URI: ${{ secrets.PROD_MONGO_URI }}
          JWT_ACCESS_SECRET: ${{ secrets.PROD_JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.PROD_JWT_REFRESH_SECRET }}
          EMAIL_SERVICE: ${{ secrets.PROD_EMAIL_SERVICE }}
          EMAIL_HOST: ${{ secrets.PROD_EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.PROD_EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.PROD_EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.PROD_EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.PROD_EMAIL_FROM }}
          FRONTEND_URL: https://aegisauth.example.com
